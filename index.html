<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MGMT 405 — Practice Exercises</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <h1>MGMT 405 Managerial Economics — Practice Exercises</h1>
  <div class="sub">UCLA Anderson · Fall 2026</div>
</header>

<!-- Shown only when localStorage is unavailable (private window, blocked embed, ...) -->
<div class="banner" id="storage-banner" hidden>Progress can't be saved in this browser or embed — open the page directly to keep your progress.</div>

<nav class="modnav" id="modnav" aria-label="Modules"></nav>

<div class="controls">
  <label for="typefilter">Question type:</label>
  <select id="typefilter">
    <option value="all">All</option>
    <option value="numeric">Numeric</option>
    <option value="conceptual">Conceptual</option>
  </select>
  <span class="stats"><span id="progress">0 / 0 attempted</span> · <strong id="correct">0 correct</strong></span>
  <button id="reset" class="reset" type="button">Reset this module</button>
</div>

<main id="main"></main>

<!-- Floating calculator -->
<button class="calc-toggle" id="calctoggle" type="button" aria-controls="calc">Calculator</button>
<div class="calc" id="calc" role="dialog" aria-label="Calculator">
  <div class="display" id="calcdisp">0</div>
  <div class="keys">
    <button type="button" class="fn" data-act="clear">C</button>
    <button type="button" class="fn" data-act="back">⌫</button>
    <button type="button" class="fn" data-key="(">(</button>
    <button type="button" class="fn" data-key=")">)</button>
    <button type="button" class="op" data-key="/">÷</button>
    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" class="op" data-key="*">×</button>
    <button type="button" class="fn" data-act="sqrt">√</button>
    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" class="op" data-key="-">−</button>
    <button type="button" class="fn" data-key="**">x^y</button>
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" class="op" data-key="+">+</button>
    <button type="button" class="fn" data-key=".">.</button>
    <button type="button" data-key="0">0</button>
    <button type="button" data-key="00">00</button>
    <button type="button" class="eq" data-act="eq">=</button>
  </div>
</div>

<!-- App, then one data file per module (data-module = the module id it registers) -->
<script src="assets/figures.js"></script>
<script src="assets/app.js"></script>
<script src="data/module1.js" data-module="m1"></script>
</body>
</html>
